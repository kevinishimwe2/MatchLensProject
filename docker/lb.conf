upstream matchlens_servers {
    least_conn;

    server web01:80 max_fails=3 fail_timeout=30s;
    server web02:80 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    add_header X-MatchLens-Load-Balancer lb01 always;

    location = /health {
        access_log off;
        default_type application/json;

        return 200 '{"status":"ok","service":"lb01"}';
    }

    location / {
        proxy_pass http://matchlens_servers;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
